name: signed-release
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing Git tag with an empty published Release (retry)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: signed-release-${{ github.event.inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false
jobs:
  release:
    if: github.repository == 'Horooko/XKeen-HotWatcher'
    runs-on: ubuntu-latest
    environment: signed-release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Validate, build, sign and publish
        env:
          RELEASE_TAG: ${{ github.event.inputs.tag || github.event.release.tag_name }}
          UPDATE_SIGNING_SEED: ${{ secrets.UPDATE_SIGNING_SEED }}
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release tag must be vMAJOR.MINOR.PATCH."
            exit 1
          fi
          if [[ "$(git describe --tags --exact-match)" != "$RELEASE_TAG" ]]; then
            echo "::error::The checkout must point exactly at $RELEASE_TAG."
            exit 1
          fi
          if [[ -z "$UPDATE_SIGNING_SEED" ]]; then
            echo "::error::Set UPDATE_SIGNING_SEED in the signed-release GitHub environment before publishing a Release."
            exit 1
          fi
          go run ./cmd/release-tool verify-seed-env
          release_json="$(gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG")"
          if ! jq -e --arg tag "$RELEASE_TAG" '.tag_name == $tag and .draft == false and .prerelease == false' <<< "$release_json" >/dev/null; then
            echo "::error::Release $RELEASE_TAG must be published, stable, and point to the checked-out tag."
            exit 1
          fi
          if jq -e '.immutable == true' <<< "$release_json" >/dev/null; then
            echo "::error::Published Release $RELEASE_TAG is immutable; GitHub cannot add assets after publication. Disable immutable releases before creating the next Release."
            exit 1
          fi
          if ! jq -e '.assets | length == 0' <<< "$release_json" >/dev/null; then
            echo "::error::Release $RELEASE_TAG already has uploaded assets. Use a new version rather than replacing signed files."
            exit 1
          fi
          go test ./...
          go vet ./...
          version="${RELEASE_TAG#v}"
          IFS=. read -r major minor patch <<< "$version"
          sequence=$((major*1000000+minor*1000+patch))
          commit="$(git rev-parse HEAD)"
          built="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          mkdir -p release-out
          for arch in arm64 amd64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags="-s -w -X local/xkeen-hot-watcher/internal/hotwatcher.Version=$version -X local/xkeen-hot-watcher/internal/updater.Commit=$commit -X local/xkeen-hot-watcher/internal/updater.BuildTime=$built -X local/xkeen-hot-watcher/internal/updater.Dirty=false" -o "release-out/hotwatcher_${RELEASE_TAG}_linux_${arch}" ./cmd/hotwatcher
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" go build -trimpath -ldflags='-s -w' -o "release-out/hotwatcher-updater_linux_${arch}" ./cmd/hotwatcher-updater
            mkdir -p "release-out/package-${arch}/dist"
            cp "release-out/hotwatcher_${RELEASE_TAG}_linux_${arch}" "release-out/package-${arch}/dist/hotwatcher-linux-${arch}"
            cp "release-out/hotwatcher-updater_linux_${arch}" "release-out/package-${arch}/dist/hotwatcher-updater-linux-${arch}"
            cp install.sh "release-out/package-${arch}/"
            cp README.md LICENSE "release-out/package-${arch}/"
            cp -r docs "release-out/package-${arch}/"
            cp -r scripts "release-out/package-${arch}/"
            (cd "release-out/package-${arch}/dist" && sha256sum * > SHA256SUMS)
            tar -czf "release-out/xkeen-hotwatcher_${RELEASE_TAG}_linux_${arch}.tar.gz" -C "release-out/package-${arch}" .
          done
          go run ./cmd/release-tool manifest "$RELEASE_TAG" "$commit" "$sequence" "release-out/hotwatcher_${RELEASE_TAG}_linux_arm64" "release-out/hotwatcher_${RELEASE_TAG}_linux_amd64"
          go run ./cmd/release-tool sign-env release-manifest.json release-manifest.sig
          go run ./cmd/release-tool verify release-manifest.json release-manifest.sig
          "release-out/hotwatcher_${RELEASE_TAG}_linux_amd64" version --json | jq -e --arg version "$version" --arg commit "$commit" '.version==$version and .commit==$commit and .arch=="amd64" and .dirty==false'
          mv release-manifest.json release-manifest.sig release-out/
          (cd release-out && sha256sum hotwatcher_* xkeen-hotwatcher_* release-manifest.json release-manifest.sig > SHA256SUMS)
          gh release upload "$RELEASE_TAG" release-out/hotwatcher_* release-out/xkeen-hotwatcher_* release-out/release-manifest.json release-out/release-manifest.sig release-out/SHA256SUMS
          mkdir release-verify
          gh release download "$RELEASE_TAG" --dir release-verify
          (cd release-verify && sha256sum -c SHA256SUMS)
