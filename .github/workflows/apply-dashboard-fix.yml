name: apply-dashboard-fix
on:
  push:
    branches: [fix/dashboard-runtime-status]
    paths: [.dashboard-fix.patch, .dashboard-version-tests.patch, .github/workflows/apply-dashboard-fix.yml]
permissions:
  contents: write
concurrency:
  group: apply-dashboard-fix
  cancel-in-progress: false
jobs:
  apply:
    if: github.repository == 'Horooko/XKeen-HotWatcher' && github.ref == 'refs/heads/fix/dashboard-runtime-status'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dashboard-runtime-status
      - name: Apply previously tested patch on the isolated fix branch
        run: |
          git apply --check --unidiff-zero --index .dashboard-fix.patch .dashboard-version-tests.patch
          git apply --unidiff-zero --index .dashboard-fix.patch .dashboard-version-tests.patch
          git rm .dashboard-fix.patch .dashboard-version-tests.patch .github/workflows/apply-dashboard-fix.yml
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test tests/webui.test.cjs
      - run: go test -race -cover ./...
      - run: go vet ./...
      - run: make build
      - name: Commit validated source without changing master
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: restore dashboard keys and independent XKeen/Xray health checks'
          git push origin HEAD:refs/heads/fix/dashboard-runtime-status
          git archive --format=tar HEAD -o "$RUNNER_TEMP/hotwatcher-source.tar"
      - uses: actions/upload-artifact@v4
        with:
          name: hotwatcher-source
          path: ${{ runner.temp }}/hotwatcher-source.tar
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: hotwatcher-linux-builds
          path: dist/
          retention-days: 7
